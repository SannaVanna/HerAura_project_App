{% extends "base.html" %}
{% block content %}
<div class="container2">
  <div class="row">
    <div class="col-md-6 mx-auto w-10px">
      <h3>Login</h3>
      <div class="bubble-container">
        <!-- Multiple bubbles -->
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
      </div>
      <form method="post" class="p-4 border rounded mt-3">
        <div class="mb-3">
          <p><label class="form-label custom-label1">Email</label></p>
          <p><input name="email" type="email" class="form-control custom-input" required></p>
        </div>
        <div class="mb-3">
          <p><label class="form-label custom-label1">Password</label></p>
          <input name="password" type="password" class="form-control custom-input t-400px" required>
        </div>
        <button class="btn nav-btn1">Login</button>
        <a class="btn nav-btn2" href="{{ url_for('auth_bp.register')}}">Don't have an account</a>
      </form>
    </div>  
  </div>
</div>
{%endblock%}
